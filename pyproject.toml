[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "worker-sandbox"
version = "0.0.0.dev0"
description = "Account-isolated sandbox that runs one coding-agent CLI invocation"
requires-python = ">=3.12"
dependencies = ["msgspec==0.21.1"]
license = "MIT"
license-files = ["LICENSE"]

[project.scripts]
worker-sandbox = "worker_sandbox.__main__:main"

[tool.setuptools]
packages = ["worker_sandbox"]
include-package-data = false
